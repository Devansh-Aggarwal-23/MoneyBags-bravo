spring.application.name=api-gateway

server.port=8080

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# KYC ROUTE
spring.cloud.gateway.server.webmvc.routes[0].id=kyc-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://KYC-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/kycs/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# NOTIFICATIONS ROUTE
spring.cloud.gateway.server.webmvc.routes[1].id=notification-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/notifications/**